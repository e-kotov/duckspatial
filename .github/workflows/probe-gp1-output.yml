name: Identify GeoParquet 1.x version written by current duckspatial
on:
  push:
    branches:
      - diagnostic/gp1-version-20261107
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      RSPM: https://packagemanager.rstudio.com/cran/__linux__/noble/latest
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: NA
      - name: Inspect exact GeoParquet version, V1 option, and whether V1.1 can be requested
        shell: Rscript {0}
        run: |
          library(duckspatial)
          library(DBI)
          library(duckdb)
          library(sf)
          cat("HEAD_BASE=677ed965894f20b5f83bdc6a389f42ccddb6a7ba (workflow-only branch)\n")
          cat("DUCKDB=",as.character(packageVersion("duckdb")),"\n")
          conn <- dbConnect(duckdb(),dbdir=":memory:")
          dbExecute(conn,"INSTALL spatial")
          dbExecute(conn,"LOAD spatial")
          input <- st_as_sf(data.frame(id=c(1L,2L),x=c(7.1,8.2),y=c(51.1,52.2)),coords=c("x","y"),crs=4326)
          for(mode in c("DEFAULT","V1","V1.1","1.1","V2","BOTH")) {
            path <- file.path(tempdir(),paste0("probe-",gsub("[^a-zA-Z0-9]","_",mode),".parquet"))
            opts <- if(mode=="DEFAULT") list() else list(GEOPARQUET_VERSION=mode)
            cat("BEGIN_MODE=",mode,"\n")
            outcome <- tryCatch({
              ddbs_write_dataset(input,path,options=opts,conn=conn,quiet=TRUE)
              data <- dbGetQuery(conn,sprintf("SELECT decode(value) AS geo FROM parquet_kv_metadata('%s') WHERE decode(key)='geo'",path))
              cat("GEOPARQUET_GEO_JSON=",paste(data$geo,collapse=""),"\n")
              if(nrow(data)>0) {
                v <- jsonlite::fromJSON(data$geo[1])$version
                cat("GEO_VERSION=",v,"\n")
              } else {cat("NO_GEOPARQUET_GEO_KEY\n")}
              schema <- dbGetQuery(conn,sprintf("SELECT * FROM parquet_schema('%s')",path))
              logicalgeo <- any(grepl("GEOMETRY",paste(unlist(schema),collapse=" "),ignore.case=TRUE))
              cat("NATIVE_GEOMETRY_LOGICAL_TYPE=",logicalgeo,"\n")
              "OK"
            },error=function(e){cat("MODE_ERROR=",conditionMessage(e),"\n");"ERROR"})
            cat("END_MODE=",mode,",OUTCOME=",outcome,"\n")
            if(mode %in% c("DEFAULT","V1")) stopifnot(outcome=="OK")
          }
          dbDisconnect(conn,shutdown=TRUE)
