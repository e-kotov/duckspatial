name: GeoParquet interoperability exact-head retry
on:
  push:
    branches: [debug/windows-exit-validation-20261106]
    paths: [tools/generate_geoparquet_fixtures.R, tools/validate_geoparquet.py]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bc6c22c9a3e41a7d2959d8678ea15f1388e06202
      - name: Verify the exact PR candidate
        run: test "$(git rev-parse HEAD)" = "bc6c22c9a3e41a7d2959d8678ea15f1388e06202"
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 5
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install independent Parquet and geometry readers
        run: python -m pip install 'pyarrow>=26' 'shapely>=2.1' pyproj 'geoparquet-validator>=0.3.1'
      - name: Generate V1 and V2 files using duckspatial
        run: Rscript tools/generate_geoparquet_fixtures.R
      - name: Independently verify values, CRS, dimensions and row-group statistics
        run: python tools/validate_geoparquet.py
      - name: Validate V1 and V2 against GeoParquet core conformance rules
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            geoparquet-validator check "$file" --class core
          done < <(find geoparquet-interop -type f -name '*.parquet' -print0)
      - name: Preserve interoperability fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geoparquet-interop
          path: geoparquet-interop
          if-no-files-found: warn
