name: validate-spatial-io-windows
on:
  push:
    branches: ['validate/spatial-io-windows-20261108']
jobs:
  targeted:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 1caace66d6e24062512882d13beae679188301ff
      - name: Verify source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "1caace66d6e24062512882d13beae679188301ff"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: check
          install-quarto: false
      - name: Targeted regression tests
        shell: bash
        run: Rscript -e 'pkgload::load_all(".", quiet=TRUE); testthat::test_local(".", filter="spatial-io", reporter="summary", stop_on_failure=TRUE)'
