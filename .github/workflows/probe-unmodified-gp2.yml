name: Probe GeoParquet V2 using unchanged duckspatial APIs
on:
  push:
    branches:
      - diagnostic/unmodified-gp2-20261107

jobs:
  unmodified-wrapper-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      RSPM: https://packagemanager.rstudio.com/cran/__linux__/noble/latest
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: NA
      - name: Verify native V2 write, inspect Parquet metadata, and read back using unmodified package
        shell: Rscript {0}
        run: |
          library(duckspatial)
          library(DBI)
          library(duckdb)
          library(sf)
          cat("TEST_SOURCE=unmodified fork main at 677ed965 (workflow-only difference)\n")
          cat("DUCKDB_R_VERSION=", as.character(packageVersion("duckdb")), "\n")
          cat("DUCKSPATIAL_VERSION=", as.character(packageVersion("duckspatial")), "\n")
          stopifnot(packageVersion("duckdb") >= package_version("2.0.0"))
          conn <- dbConnect(duckdb(), dbdir = ":memory:")
          dbExecute(conn, "INSTALL spatial")
          dbExecute(conn, "LOAD spatial")
          input <- st_as_sf(data.frame(id=c(1L,2L), x=c(7.5,8.5), y=c(50.2,51.3)), coords=c("x","y"), crs=4326)
          out <- file.path(tempdir(), "from-unmodified-ddbs-write-v2.parquet")
          cat("WRITING native V2 through generic options\n")
          ddbs_write_dataset(input, out, conn=conn,
            options=list(GEOPARQUET_VERSION="V2"), quiet=TRUE)
          stopifnot(file.exists(out))
          qpath <- gsub("'", "''", out, fixed=TRUE)
          schema <- dbGetQuery(conn, sprintf("SELECT * FROM parquet_schema('%s')",qpath))
          cat("PARQUET_SCHEMA\n")
          print(schema)
          native <- any(grepl("GEOMETRY", paste(unlist(schema),collapse=" "), ignore.case=TRUE))
          stopifnot(native)
          meta <- dbGetQuery(conn,sprintf("SELECT * FROM parquet_kv_metadata('%s')",qpath))
          cat("PARQUET_KV_METADATA\n")
          print(meta)
          types <- dbGetQuery(conn,sprintf("DESCRIBE SELECT * FROM read_parquet('%s')",qpath))
          cat("DUCKDB_READ_PARQUET_SCHEMA\n")
          print(types)
          stopifnot(any(grepl("^GEOMETRY", types$column_type)))
          cat("READING native V2 through ddbs_open_dataset()\n")
          dat <- ddbs_open_dataset(out,conn=conn)
          cat("OPEN_CLASS=",paste(class(dat),collapse=","),"\n")
          stopifnot(inherits(dat,"duckspatial_df"))
          got <- ddbs_collect(dat)
          cat("COLLECT_RESULT\n")
          print(got)
          stopifnot(inherits(got,"sf"))
          stopifnot(identical(got$id,input$id))
          stopifnot(identical(as.character(st_as_text(st_geometry(got))),as.character(st_as_text(st_geometry(input)))))
          cat("COLLECT_CRS=",st_crs(got)$epsg,"\n")
          stopifnot(identical(st_crs(got)$epsg,4326L) || isTRUE(st_crs(got)$epsg == 4326))
          cat("SUCCESS: unchanged duckspatial wrote real native GeoParquet V2, reopened it, and round-tripped CRS and geometry\n")
          dbDisconnect(conn,shutdown=TRUE)
