name: spatial-io-regression
on:
  push:
    branches:
      - 'fix/spatial-crs-reader-20261108'
      - 'fix/spatial-multigeometry-20261108'
jobs:
  regressions:
    runs-on: ubuntu-24.04
    env:
      RSPM: https://packagemanager.posit.co/cran/__linux__/noble/latest
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: check
          install-quarto: false
      - name: Targeted package regression tests
        run: |
          Rscript -e 'pkgload::load_all(".", quiet=TRUE); testthat::test_local(".", filter="spatial-io", reporter="summary", stop_on_failure=TRUE)'
