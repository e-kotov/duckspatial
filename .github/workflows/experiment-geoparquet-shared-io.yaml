name: experiment-geoparquet-shared-io
on:
  push:
    branches: ['experiment/geoparquet-shared-io-20261108']
jobs:
  targeted:
    runs-on: ubuntu-24.04
    env:
      RSPM: https://packagemanager.posit.co/cran/__linux__/noble/latest
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: check
          install-quarto: false
      - name: Validate GeoParquet and spatial I/O together
        run: Rscript -e 'pkgload::load_all(".", quiet=TRUE); testthat::test_local(".", filter="geoparquet|spatial-io", reporter="summary", stop_on_failure=TRUE)'
