name: validate-spatial-io-stack
on:
  push:
    branches:
      - validate/spatial-multigeometry-matrix-20261108
jobs:
  package-check:
    name: ${{ matrix.os }} (${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, r: release}
          - {os: ubuntu-24.04, r: oldrel}
          - {os: ubuntu-24.04, r: devel}
          - {os: macos-latest, r: release}
    env:
      RSPM: https://packagemanager.posit.co/cran/__linux__/noble/latest
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a2179833de90f9d082c413b35b6d94cb21226e4b
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "a2179833de90f9d082c413b35b6d94cb21226e4b"
        shell: bash
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          install-quarto: false
      - uses: r-lib/actions/check-r-package@v2
