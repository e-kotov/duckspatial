name: Windows GeoParquet diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-test-diagnostics:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::testthat, any::pkgload
          needs: check
      - name: New GeoParquet tests in isolation
        timeout-minutes: 10
        shell: pwsh
        run: |
          @'
          options(warn = 1)
          library(testthat)
          testthat::test_local(filter = "geoparquet-versions", reporter = "summary", stop_on_failure = TRUE)
          '@ | Set-Content -Path .github/geoparquet-isolated.R
          Rscript .github/geoparquet-isolated.R
      - name: Full test suite with file-by-file progress
        timeout-minutes: 15
        shell: pwsh
        run: |
          @'
          options(warn = 1)
          library(testthat)
          testthat::test_local(reporter = "summary", stop_on_failure = TRUE)
          '@ | Set-Content -Path .github/geoparquet-suite-diagnostics.R
          Rscript .github/geoparquet-suite-diagnostics.R
